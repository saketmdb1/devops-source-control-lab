trigger:
  branches:
    include:
      - main
      - release/*

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  pythonVersion: '3.12'

  # Azure DevOps service connections
  acrServiceConnection: 'sc-acrdevopsla'
  azureServiceConnection: 'sc-azure-deploy'

  # Azure Container Registry
  registryLoginServer: 'acrdevopsla.azurecr.io'
  imageRepository: 'devops-source-control-lab'

  # Azure resources
  resourceGroup: 'acr-rg-devops'
  webAppDevName: 'as-devops-dev'
  webAppUatName: 'as-devops-uat'
  webAppProdName: 'as-devops-prod'

stages:

# ============================================================
# STAGE 1: TEST, BUILD AND PUBLISH IMAGE
# ============================================================
- stage: BuildAndPublish
  displayName: 'Test, Build and Publish'

  jobs:
  - job: Build
    displayName: 'Run tests and publish image'

    steps:
    - checkout: self
      displayName: 'Checkout source code'

    - task: UsePythonVersion@0
      displayName: 'Set up Python'
      inputs:
        versionSpec: '$(pythonVersion)'

    - script: |
        python -m pip install --upgrade pip
        python -m pip install Flask pytest
      displayName: 'Install test dependencies'

    - script: |
        python -m pytest -v
      displayName: 'Run unit tests'

    # Main branch: publish build ID and latest tags
    - task: Docker@2
      displayName: 'Build and push main image'
      condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
      inputs:
        command: 'buildAndPush'
        containerRegistry: '$(acrServiceConnection)'
        repository: '$(imageRepository)'
        Dockerfile: '$(Build.SourcesDirectory)/Dockerfile'
        buildContext: '$(Build.SourcesDirectory)'
        tags: |
          $(Build.BuildId)
          latest

    # Release branch: publish build ID and version tags
    - task: Docker@2
      displayName: 'Build and push release image'
      condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/heads/release/'))
      inputs:
        command: 'buildAndPush'
        containerRegistry: '$(acrServiceConnection)'
        repository: '$(imageRepository)'
        Dockerfile: '$(Build.SourcesDirectory)/Dockerfile'
        buildContext: '$(Build.SourcesDirectory)'
        tags: |
          $(Build.BuildId)
          $(Build.SourceBranchName)


# ============================================================
# STAGE 2: DEPLOY MAIN TO DEVELOPMENT APP SERVce
# ============================================================
- stage: DeployDev
  displayName: 'Deploy to Development'
  dependsOn: BuildAndPublish
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))

  jobs:
  - job: DeployDevApp
    displayName: 'Deploy and verify Dev App Service'

    steps:
    - task: AzureCLI@2
      displayName: 'Deploy image and verify health'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          set -e

          IMAGE="$(registryLoginServer)/$(imageRepository):$(Build.BuildId)"

          echo "Deploying $IMAGE to $(webAppDevName)"

          # Configure managed identity authentication for ACR pulls
          az webapp config set \
            --resource-group "$(resourceGroup)" \
            --name "$(webAppDevName)" \
            --generic-configurations '{"acrUseManagedIdentityCreds": true}'

          # Configure the Docker image
          az webapp config container set \
            --resource-group "$(resourceGroup)" \
            --name "$(webAppDevName)" \
            --container-image-name "$IMAGE" \
            --container-registry-url "https://$(registryLoginServer)"

          # Ensure the Flask container port is configured
          az webapp config appsettings set \
            --resource-group "$(resourceGroup)" \
            --name "$(webAppDevName)" \
            --settings WEBSITES_PORT=8000

          # Restart the application
          az webapp restart \
            --resource-group "$(resourceGroup)" \
            --name "$(webAppDevName)"

          # Get the App Service hostname
          FQDN=$(az webapp show \
            --resource-group "$(resourceGroup)" \
            --name "$(webAppDevName)" \
            --query defaultHostName \
            --output tsv)

          if [ -z "$FQDN" ] || [ "$FQDN" = "null" ]; then
            echo "ERROR: Development hostname not found."
            exit 1
          fi

          echo "Checking https://$FQDN/health"

          # Retry health check for approximately 2 minutes
          for i in {1..12}; do
            if curl --fail --silent --show-error \
              "https://$FQDN/health"; then
              echo ""
              echo "Development health check passed."
              exit 0
            fi

            echo "Attempt $i failed. Retrying in 10 seconds."
            sleep 10
          done

          echo "ERROR: Development health check failed."
          exit 1


- task: AzureCLI@2
  displayName: 'Deploy UAT with automatic rollback'
  inputs:
    azureSubscription: 'sc-azure-deploy'
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      set -u

      RG="acr-rg-devops"
      APP="as-devops-uat"
      REGISTRY="$(registryLoginServer)"
      REPOSITORY="$(imageRepository)"
      NEW_IMAGE="${REGISTRY}/${REPOSITORY}:$(Build.BuildId)"
      HEALTH_URL="https://${APP}.azurewebsites.net/health"

      echo "Reading the currently configured UAT image..."

      CURRENT_CONFIG=$(az webapp config container show \
        --resource-group "$RG" \
        --name "$APP" \
        --query "[?name=='DOCKER_CUSTOM_IMAGE_NAME'].value | [0]" \
        --output tsv) || exit 1

      if [ -z "$CURRENT_CONFIG" ] || [ "$CURRENT_CONFIG" = "None" ]; then
        echo "ERROR: Could not identify the current UAT image."
        exit 1
      fi

      # Remove Azure's DOCKER| prefix before passing the image to Azure CLI.
      PREVIOUS_IMAGE="${CURRENT_CONFIG#DOCKER|}"

      echo "Previous image: $PREVIOUS_IMAGE"
      echo "Target image:   $NEW_IMAGE"

      if [ "$PREVIOUS_IMAGE" = "$NEW_IMAGE" ]; then
        echo "The target image is already configured. Continuing with health verification."
      fi

      # Deploy the new image. If configuration fails, attempt rollback.
      if ! az webapp config container set \
        --resource-group "$RG" \
        --name "$APP" \
        --container-image-name "$NEW_IMAGE" \
        --container-registry-url "https://${REGISTRY}"; then
        echo "ERROR: New image configuration failed. Attempting rollback."
        DEPLOY_FAILED=1
      else
        DEPLOY_FAILED=0
      fi

      if [ "$DEPLOY_FAILED" -eq 0 ]; then
        if ! az webapp config set \
          --resource-group "$RG" \
          --name "$APP" \
          --generic-configurations '{"acrUseManagedIdentityCreds": true}'; then
          echo "ERROR: Failed to configure managed identity for ACR pulls."
          DEPLOY_FAILED=1
        fi
      fi

      if [ "$DEPLOY_FAILED" -eq 0 ]; then
        if ! az webapp config appsettings set \
          --resource-group "$RG" \
          --name "$APP" \
          --settings WEBSITES_PORT=8000; then
          echo "ERROR: Failed to configure the application port."
          DEPLOY_FAILED=1
        fi
      fi

      if [ "$DEPLOY_FAILED" -eq 0 ]; then
        if ! az webapp restart --resource-group "$RG" --name "$APP"; then
          echo "ERROR: App Service restart command failed."
          DEPLOY_FAILED=1
        fi
      fi

      # Retry the new deployment's health check.
      if [ "$DEPLOY_FAILED" -eq 0 ]; then
        HEALTHY=0

        for attempt in $(seq 1 12); do
          echo "UAT health check attempt $attempt of 12..."

          if curl --fail --silent --show-error "$HEALTH_URL"; then
            echo "UAT health check passed."
            HEALTHY=1
            break
          fi

          sleep 10
        done

        if [ "$HEALTHY" -ne 1 ]; then
          echo "ERROR: New deployment failed its health check."
          DEPLOY_FAILED=1
        fi
      fi

      # On any deployment or health-check failure, restore the prior image.
      if [ "$DEPLOY_FAILED" -ne 0 ]; then
        echo "Rolling UAT back to: $PREVIOUS_IMAGE"

        if ! az webapp config container set \
          --resource-group "$RG" \
          --name "$APP" \
          --container-image-name "$PREVIOUS_IMAGE" \
          --container-registry-url "https://${REGISTRY}"; then
          echo "CRITICAL: Could not restore the previous image configuration."
          exit 1
        fi

        if ! az webapp config set \
          --resource-group "$RG" \
          --name "$APP" \
          --generic-configurations '{"acrUseManagedIdentityCreds": true}'; then
          echo "CRITICAL: Could not restore the ACR managed-identity configuration."
          exit 1
        fi

        if ! az webapp restart --resource-group "$RG" --name "$APP"; then
          echo "CRITICAL: Rollback restart failed."
          exit 1
        fi

        ROLLBACK_HEALTHY=0

        for attempt in $(seq 1 12); do
          echo "Rollback health check attempt $attempt of 12..."

          if curl --fail --silent --show-error "$HEALTH_URL"; then
            echo "Rollback health check passed."
            ROLLBACK_HEALTHY=1
            break
          fi

          sleep 10
        done

        if [ "$ROLLBACK_HEALTHY" -ne 1 ]; then
          echo "CRITICAL: Rollback completed, but UAT is still unhealthy."
        else
          echo "Rollback restored the previous image successfully."
        fi

        # Keep the pipeline failed so the unsuccessful deployment is visible.
        exit 1
      fi

      echo "UAT deployment and health check completed successfully."


# STAGE 3: DEPLOY TO UAT
- stage: DeployUAT
  displayName: 'Deploy to UAT'
  dependsOn: DeployDev
  condition: and(
    succeeded(),
    eq(variables['Build.SourceBranch'], 'refs/heads/main')
    )

  jobs:
  - deployment: DeployUATApp
    displayName: 'Deploy and verify UAT App Service'
    environment: 'appservice-uat'

    strategy:
      runOnce:
        deploy:
          steps:          
          - task: AzureCLI@2
            displayName: 'Deploy UAT with automatic rollback'
            inputs:
              azureSubscription: 'sc-azure-deploy'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -u

                RG="acr-rg-devops"
                APP="as-devops-uat"
                REGISTRY="$(registryLoginServer)"
                REPOSITORY="$(imageRepository)"
                NEW_IMAGE="${REGISTRY}/${REPOSITORY}:$(Build.BuildId)"
                HEALTH_URL="https://${APP}.azurewebsites.net/health"

                echo "Reading the currently configured UAT image..."

                CURRENT_CONFIG=$(az webapp config container show \
                  --resource-group "$RG" \
                  --name "$APP" \
                  --query "[?name=='DOCKER_CUSTOM_IMAGE_NAME'].value | [0]" \
                  --output tsv) || exit 1

                if [ -z "$CURRENT_CONFIG" ] || [ "$CURRENT_CONFIG" = "None" ]; then
                  echo "ERROR: Could not identify the current UAT image."
                  exit 1
                fi

                # Remove Azure's DOCKER| prefix before passing the image to Azure CLI.
                PREVIOUS_IMAGE="${CURRENT_CONFIG#DOCKER|}"

                echo "Previous image: $PREVIOUS_IMAGE"
                echo "Target image:   $NEW_IMAGE"

                if [ "$PREVIOUS_IMAGE" = "$NEW_IMAGE" ]; then
                  echo "The target image is already configured. Continuing with health verification."
                fi

                # Deploy the new image. If configuration fails, attempt rollback.
                if ! az webapp config container set \
                  --resource-group "$RG" \
                  --name "$APP" \
                  --container-image-name "$NEW_IMAGE" \
                  --container-registry-url "https://${REGISTRY}"; then
                  echo "ERROR: New image configuration failed. Attempting rollback."
                  DEPLOY_FAILED=1
                else
                  DEPLOY_FAILED=0
                fi

                if [ "$DEPLOY_FAILED" -eq 0 ]; then
                  if ! az webapp config set \
                    --resource-group "$RG" \
                    --name "$APP" \
                    --generic-configurations '{"acrUseManagedIdentityCreds": true}'; then
                    echo "ERROR: Failed to configure managed identity for ACR pulls."
                    DEPLOY_FAILED=1
                  fi
                fi

                if [ "$DEPLOY_FAILED" -eq 0 ]; then
                  if ! az webapp config appsettings set \
                    --resource-group "$RG" \
                    --name "$APP" \
                    --settings WEBSITES_PORT=8000; then
                    echo "ERROR: Failed to configure the application port."
                    DEPLOY_FAILED=1
                  fi
                fi

                if [ "$DEPLOY_FAILED" -eq 0 ]; then
                  if ! az webapp restart --resource-group "$RG" --name "$APP"; then
                    echo "ERROR: App Service restart command failed."
                    DEPLOY_FAILED=1
                  fi
                fi

                # Retry the new deployment's health check.
                if [ "$DEPLOY_FAILED" -eq 0 ]; then
                  HEALTHY=0

                  for attempt in $(seq 1 12); do
                    echo "UAT health check attempt $attempt of 12..."

                    if curl --fail --silent --show-error "$HEALTH_URL"; then
                      echo "UAT health check passed."
                      HEALTHY=1
                      break
                    fi

                    sleep 10
                  done

                  if [ "$HEALTHY" -ne 1 ]; then
                    echo "ERROR: New deployment failed its health check."
                    DEPLOY_FAILED=1
                  fi
                fi

                # On any deployment or health-check failure, restore the prior image.
                if [ "$DEPLOY_FAILED" -ne 0 ]; then
                  echo "Rolling UAT back to: $PREVIOUS_IMAGE"

                  if ! az webapp config container set \
                    --resource-group "$RG" \
                    --name "$APP" \
                    --container-image-name "$PREVIOUS_IMAGE" \
                    --container-registry-url "https://${REGISTRY}"; then
                    echo "CRITICAL: Could not restore the previous image configuration."
                    exit 1
                  fi

                  if ! az webapp config set \
                    --resource-group "$RG" \
                    --name "$APP" \
                    --generic-configurations '{"acrUseManagedIdentityCreds": true}'; then
                    echo "CRITICAL: Could not restore the ACR managed-identity configuration."
                    exit 1
                  fi

                  if ! az webapp restart --resource-group "$RG" --name "$APP"; then
                    echo "CRITICAL: Rollback restart failed."
                    exit 1
                  fi

                  ROLLBACK_HEALTHY=0

                  for attempt in $(seq 1 12); do
                    echo "Rollback health check attempt $attempt of 12..."

                    if curl --fail --silent --show-error "$HEALTH_URL"; then
                      echo "Rollback health check passed."
                      ROLLBACK_HEALTHY=1
                      break
                    fi

                    sleep 10
                  done

                  if [ "$ROLLBACK_HEALTHY" -ne 1 ]; then
                    echo "CRITICAL: Rollback completed, but UAT is still unhealthy."
                  else
                    echo "Rollback restored the previous image successfully."
                  fi

                  # Keep the pipeline failed so the unsuccessful deployment is visible.
                  exit 1
                fi

                echo "UAT deployment and health check completed successfully."

# STAGE 4: DEPLOY TO PRODUCTION
- stage: DeployProd
  displayName: 'Deploy to Production'
  dependsOn: DeployUAT
  condition: and(
    succeeded(),
    eq(variables['Build.SourceBranch'], 'refs/heads/main')
    )

  jobs:
  - deployment: DeployProdApp
    displayName: 'Deploy approved release'
    environment: 'appservice-production'

    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureCLI@2
            displayName: 'Deploy image and verify Production health'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -e

                IMAGE="$(registryLoginServer)/$(imageRepository):$(Build.BuildId)"

                echo "Deploying $IMAGE to $(webAppProdName)"

                az webapp config set \
                  --resource-group "$(resourceGroup)" \
                  --name "$(webAppProdName)" \
                  --generic-configurations '{"acrUseManagedIdentityCreds": true}'

                az webapp config container set \
                  --resource-group "$(resourceGroup)" \
                  --name "$(webAppProdName)" \
                  --container-image-name "$IMAGE" \
                  --container-registry-url "https://$(registryLoginServer)"

                az webapp config appsettings set \
                  --resource-group "$(resourceGroup)" \
                  --name "$(webAppProdName)" \
                  --settings WEBSITES_PORT=8000

                az webapp restart \
                  --resource-group "$(resourceGroup)" \
                  --name "$(webAppProdName)"

                FQDN=$(az webapp show \
                  --resource-group "$(resourceGroup)" \
                  --name "$(webAppProdName)" \
                  --query defaultHostName \
                  --output tsv)

                if [ -z "$FQDN" ] || [ "$FQDN" = "null" ]; then
                  echo "ERROR: Production hostname not found."
                  exit 1
                fi

                echo "Checking https://$FQDN/health"

                for i in {1..12}; do
                  if curl --fail --silent --show-error \
                    "https://$FQDN/health"; then
                    echo ""
                    echo "Production health check passed."
                    exit 0
                  fi

                  echo "Attempt $i failed. Retrying in 10 seconds."
                  sleep 10
                done

                echo "ERROR: Production health check failed."
                exit 1
