trigger:
  branches:
    include:
      - main
      - release/*

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  pythonVersion: '3.12'

  # Azure DevOps service connections
  acrServiceConnection: 'sc-acrdevopsla'
  azureServiceConnection: 'sc-azure-deploy'

  # Azure Container Registry
  registryLoginServer: 'acrdevopsla.azurecr.io'
  imageRepository: 'devops-source-control-lab'

  # Azure resources
  resourceGroup: 'acr-rg-devops'
  webAppDevName: 'as-devops-dev'
  webAppUatName: 'as-devops-uat'
  webAppProdName: 'as-devops-prod'

stages:

# ============================================================
# STAGE 1: TEST, BUILD AND PUBLISH IMAGE
# ============================================================
- stage: BuildAndPublish
  displayName: 'Test, Build and Publish'

  jobs:
  - job: Build
    displayName: 'Run tests and publish image'

    steps:
    - checkout: self
      displayName: 'Checkout source code'

    - task: UsePythonVersion@0
      displayName: 'Set up Python'
      inputs:
        versionSpec: '$(pythonVersion)'

    - script: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
      displayName: 'Install test dependencies'

    - script: |
        python -m pytest -v
      displayName: 'Run unit tests'

    # Main branch: publish build ID and latest tags
    - task: Docker@2
      displayName: 'Build and push main image'
      condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
      inputs:
        command: 'buildAndPush'
        containerRegistry: '$(acrServiceConnection)'
        repository: '$(imageRepository)'
        Dockerfile: '$(Build.SourcesDirectory)/Dockerfile'
        buildContext: '$(Build.SourcesDirectory)'
        tags: |
          $(Build.BuildId)
          latest

    # Release branch: publish build ID and version tags
    - task: Docker@2
      displayName: 'Build and push release image'
      condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/heads/release/'))
      inputs:
        command: 'buildAndPush'
        containerRegistry: '$(acrServiceConnection)'
        repository: '$(imageRepository)'
        Dockerfile: '$(Build.SourcesDirectory)/Dockerfile'
        buildContext: '$(Build.SourcesDirectory)'
        tags: |
          $(Build.BuildId)
          $(Build.SourceBranchName)


# ============================================================
# STAGE 2: DEPLOY MAIN TO DEVELOPMENT APP SERVICE
# ============================================================
- stage: DeployDev
  displayName: 'Deploy to Development'
  dependsOn: BuildAndPublish
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))

  jobs:
  - job: DeployDevApp
    displayName: 'Deploy and verify Dev App Service'

    steps:
    - task: AzureCLI@2
      displayName: 'Deploy image and verify health'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          set -e

          IMAGE="$(registryLoginServer)/$(imageRepository):$(Build.BuildId)"

          echo "Deploying $IMAGE to $(webAppDevName)"

          # Configure managed identity authentication for ACR pulls
          az webapp config set \
            --resource-group "$(resourceGroup)" \
            --name "$(webAppDevName)" \
            --generic-configurations '{"acrUseManagedIdentityCreds": true}'

          # Configure the Docker image
          az webapp config container set \
            --resource-group "$(resourceGroup)" \
            --name "$(webAppDevName)" \
            --container-image-name "$IMAGE" \
            --container-registry-url "https://$(registryLoginServer)"

          # Ensure the Flask container port is configured
          az webapp config appsettings set \
            --resource-group "$(resourceGroup)" \
            --name "$(webAppDevName)" \
            --settings WEBSITES_PORT=8000

          # Restart the application
          az webapp restart \
            --resource-group "$(resourceGroup)" \
            --name "$(webAppDevName)"

          # Get the App Service hostname
          FQDN=$(az webapp show \
            --resource-group "$(resourceGroup)" \
            --name "$(webAppDevName)" \
            --query defaultHostName \
            --output tsv)

          if [ -z "$FQDN" ] || [ "$FQDN" = "null" ]; then
            echo "ERROR: Development hostname not found."
            exit 1
          fi

          echo "Checking https://$FQDN/health"

          # Retry health check for approximately 2 minutes
          for i in {1..12}; do
            if curl --fail --silent --show-error \
              "https://$FQDN/health"; then
              echo ""
              echo "Development health check passed."
              exit 0
            fi

            echo "Attempt $i failed. Retrying in 10 seconds."
            sleep 10
          done

          echo "ERROR: Development health check failed."
          exit 1


# STAGE 3: DEPLOY TO UAT
- stage: DeployUAT
  displayName: 'Deploy to UAT'
  dependsOn: DeployDev
  condition: and(
    succeeded(),
    eq(variables['Build.SourceBranch'], 'refs/heads/main')
    )

  jobs:
  - deployment: DeployUATApp
    displayName: 'Deploy and verify UAT App Service'
    environment: 'appservice-uat'

    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureCLI@2
            displayName: 'Deploy image and verify UAT health'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -e

                IMAGE="$(registryLoginServer)/$(imageRepository):$(Build.BuildId)"

                echo "Deploying $IMAGE to $(webAppUatName)"

                az webapp config set \
                  --resource-group "$(resourceGroup)" \
                  --name "$(webAppUatName)" \
                  --generic-configurations '{"acrUseManagedIdentityCreds": true}'

                az webapp config container set \
                  --resource-group "$(resourceGroup)" \
                  --name "$(webAppUatName)" \
                  --container-image-name "$IMAGE" \
                  --container-registry-url "https://$(registryLoginServer)"

                az webapp config appsettings set \
                  --resource-group "$(resourceGroup)" \
                  --name "$(webAppUatName)" \
                  --settings WEBSITES_PORT=8000

                az webapp restart \
                  --resource-group "$(resourceGroup)" \
                  --name "$(webAppUatName)"

                FQDN=$(az webapp show \
                  --resource-group "$(resourceGroup)" \
                  --name "$(webAppUatName)" \
                  --query defaultHostName \
                  --output tsv)

                if [ -z "$FQDN" ] || [ "$FQDN" = "null" ]; then
                  echo "ERROR: UAT hostname not found."
                  exit 1
                fi

                echo "Checking https://$FQDN/health"

                for i in {1..12}; do
                  if curl --fail --silent --show-error \
                    "https://$FQDN/health"; then
                    echo ""
                    echo "UAT health check passed."
                    exit 0
                  fi

                  echo "Attempt $i failed. Retrying in 10 seconds."
                  sleep 10
                done

                echo "ERROR: UAT health check failed."
                exit 1


# STAGE 4: POST-DEPLOYMENT UAT INTEGRATION TESTS
- stage: UATIntegrationTests
  displayName: 'UAT Integration Tests'
  dependsOn: DeployUAT
  condition: succeeded()

  jobs:
  - job: RunIntegrationTests
    displayName: 'Test live UAT endpoints'

    steps:
    - checkout: self

    - task: UsePythonVersion@0
      displayName: 'Set up Python'
      inputs:
        versionSpec: '$(pythonVersion)'

    - script: |
        python -m pip install --upgrade pip
        python -m pip install pytest requests
      displayName: 'Install integration test dependencies'

    - script: |
        python -m pytest -v test_integration.py
      displayName: 'Run live UAT integration tests'
      env:
        UAT_BASE_URL: https://$(webAppUatName).azurewebsites.net


# STAGE 4: DEPLOY TO PRODUCTION
- stage: DeployProd
  displayName: 'Deploy to Production'
  dependsOn: UATIntegrationTests
  condition: and(
    succeeded(),
    eq(variables['Build.SourceBranch'], 'refs/heads/main')
    )

  jobs:
  - deployment: DeployProdApp
    displayName: 'Deploy approved release'
    environment: 'appservice-production'

    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureCLI@2
            displayName: 'Deploy image and verify Production health'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -e

                IMAGE="$(registryLoginServer)/$(imageRepository):$(Build.BuildId)"

                echo "Deploying $IMAGE to $(webAppProdName)"

                az webapp config set \
                  --resource-group "$(resourceGroup)" \
                  --name "$(webAppProdName)" \
                  --generic-configurations '{"acrUseManagedIdentityCreds": true}'

                az webapp config container set \
                  --resource-group "$(resourceGroup)" \
                  --name "$(webAppProdName)" \
                  --container-image-name "$IMAGE" \
                  --container-registry-url "https://$(registryLoginServer)"

                az webapp config appsettings set \
                  --resource-group "$(resourceGroup)" \
                  --name "$(webAppProdName)" \
                  --settings WEBSITES_PORT=8000

                az webapp restart \
                  --resource-group "$(resourceGroup)" \
                  --name "$(webAppProdName)"

                FQDN=$(az webapp show \
                  --resource-group "$(resourceGroup)" \
                  --name "$(webAppProdName)" \
                  --query defaultHostName \
                  --output tsv)

                if [ -z "$FQDN" ] || [ "$FQDN" = "null" ]; then
                  echo "ERROR: Production hostname not found."
                  exit 1
                fi

                echo "Checking https://$FQDN/health"

                for i in {1..12}; do
                  if curl --fail --silent --show-error \
                    "https://$FQDN/health"; then
                    echo ""
                    echo "Production health check passed."
                    exit 0
                  fi

                  echo "Attempt $i failed. Retrying in 10 seconds."
                  sleep 10
                done

                echo "ERROR: Production health check failed."
                exit 1
