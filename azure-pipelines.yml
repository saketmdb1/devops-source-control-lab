trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  pythonVersion: '3.12'

steps:
  - checkout: self
    displayName: 'checkout souce code'

  - task: UsePythonVersion@0
    displayName: 'set up python'
    inputs:
      versionSpec: '$(pythonVersion)'

  - script: |
      python -m pip install --upgrade pip
      python -m pip install pytest
    displayName: 'Install Test dependencies'
  
  - script: 
      python -m pytest -v
    displayName: 'run unit tests'
  
  - script:
      docker build -t devops-source-control-lab:$(Build.BuildId) .
    displayName: 'Build Docker Image'

  - task: Dcoker@2
    displayName: 'Build and push docker Image'
    inputs:
      command: buildAndPush
      containerRegistry: 'sc-acrdevopsla'
      repository: 'devops-source-control-lab'
      Dockerfile: '$(Build.SourcesDirectory)/Dockerfile'
      buildContext: '$(Build.SourceDirectory)'
      tags: |
        $(build.BuildId)

